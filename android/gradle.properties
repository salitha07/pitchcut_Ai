
# Gradle JVM memory settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Reduce parallel memory usage
org.gradle.workers.max=2
org.gradle.parallel=false

# Increase network download timeouts
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# AndroidX support
android.useAndroidX=true

# Flutter Android template compatibility
android.newDsl=false
android.builtInKotlin=false

# Kotlin incremental compilation
kotlin.incremental=false
