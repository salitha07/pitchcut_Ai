name: pitchcut_ai
description: "PitchCut AI - Video Editing and Presentation Analysis App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

  # State Management
  flutter_riverpod: ^3.4.3

  # Navigation
  go_router: ^18.0.2

  # Authentication
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.3.3


  # Video and Camera
  camera: ^0.12.1
  video_player: ^2.14.1
  image_picker: ^1.2.4

  # File Management
  file_picker: ^13.3.2
  path_provider: ^2.1.6
  path: ^1.9.1

  # Utilities
  uuid: ^4.6.0
  sensors_plus: ^7.1.1
  google_mlkit_face_detection: ^1.0.2
  material_ui: any
  whisper_wrapper: 3.0.3
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  mocktail: ^1.0.5
  video_player_platform_interface: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/features/